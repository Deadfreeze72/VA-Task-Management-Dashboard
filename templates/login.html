{% extends "base.html" %}


{% block title %}
Login
{% endblock %}



{% block content %}


<div class="auth-box">


    <h2>
        Login
    </h2>



    <form method="POST" autocomplete="off">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>
            Email Address
        </label>


        <input

            type="email"

            name="email"

            placeholder="Enter your email"

            autocomplete="off"

            required>




        <label>
            Password
        </label>


        <input

            type="password"

            name="password"

            placeholder="Enter your password"

            autocomplete="new-password"

            required>




        <button type="submit">
            Login
        </button>


    </form>



    <p>

        Don't have an account?

        <a href="/register">
            Register here
        </a>

    </p>



</div>


{% endblock %}
